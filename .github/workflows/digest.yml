name: Digest da inbox

on:
  schedule:
    # Horários em UTC. São Paulo é UTC-3 → 08:00 e 18:00 no seu fuso.
    # O GitHub costuma atrasar alguns minutos em horários "redondos".
    - cron: "5 11 * * *"
    - cron: "5 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só mostrar a prévia no log, sem enviar"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Enviar digest
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_digest.py ${{ inputs.dry_run && '--dry-run' || '' }}
